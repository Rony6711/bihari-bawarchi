<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Bihari Bawarchi">
  <defs>
    <!-- Gold Gradient for Logo/Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <!-- Deep Red/Maroon Gradient -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#900C3F"/>
      <stop offset="100%" stop-color="#58001D"/>
    </linearGradient>
  </defs>

  <g transform="translate(48, 48)">
    <circle cx="0" cy="0" r="44" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="37" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.75"/>

    <!-- Rose/Floral Flourishes -->
    <circle cx="-42" cy="35" r="5" fill="url(#maroonGrad)"/>
    <circle cx="42" cy="35" r="5" fill="url(#maroonGrad)"/>
    <circle cx="-42" cy="35" r="5.8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <circle cx="42" cy="35" r="5.8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <path d="M -35,45 Q -45,40 -48,30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 35,45 Q 45,40 48,30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <path d="M0 -26 C3 -14 12 -8 0 4 C-12 -8 -3 -14 0 -26Z" fill="url(#goldGrad)"/>
    <path d="M0 -20 C1.6 -12 7 -8 0 -1 C-7 -8 -1.6 -12 0 -20Z" fill="#58001D" opacity="0.28"/>
    <text x="0" y="18" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="url(#goldGrad)" letter-spacing="1.2">BB</text>
    <path d="M-16 26 Q0 34 16 26" fill="none" stroke="url(#goldGrad)" stroke-width="1.1"/>
  </g>

  <text x="108" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="url(#maroonGrad)" letter-spacing="2.6">BIHARI</text>
  <text x="108" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="url(#goldGrad)" letter-spacing="3.4">BAWARCHI</text>
  <line x1="108" y1="76" x2="292" y2="76" stroke="url(#goldGrad)" stroke-width="1.1"/>
</svg>
